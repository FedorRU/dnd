<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Гримуар партии</title>
<meta name="theme-color" content="#1b2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Гримуар">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* One phone column: sticky header (character + tabs), panels below. System fonts so it works offline. */
:root{
  --bg:#e9edf2; --card:#f7f9fb; --ink:#18202c; --muted:#5d6878; --line:#cdd5df;
  --accent:#2b4f86; --accent-ink:#ffffff; --conc:#6a3f8e; --conc-soft:#ece3f4;
  --chip:#dfe6ef; --pip:#2b4f86; --pip-off:#c4ccd7; --danger:#a33a2b;
  --display:"Iowan Old Style","Palatino",Georgia,serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f141c; --card:#171e29; --ink:#e3e8ef; --muted:#93a0b3; --line:#2a3443;
  --accent:#8fb0e6; --accent-ink:#0f141c; --conc:#c29be3; --conc-soft:#2a2136;
  --chip:#222c3a; --pip:#8fb0e6; --pip-off:#344052; --danger:#e88a7b; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.4rem}
h2{font-size:1.05rem}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);min-width:0}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sub{color:var(--muted);font-size:.85rem}
.note{color:var(--muted);font-size:.82rem;margin:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{display:flex;flex-direction:column;gap:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.boxh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--chip);font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.conc{background:var(--conc);color:var(--accent-ink);border-color:var(--conc)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.step{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--chip);font-weight:700;padding:0}
.num{font:600 1.05rem var(--mono);min-width:2.2em;text-align:center;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--chip);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center}
.stat b{font:600 1.2rem var(--mono)}
.stat span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.slot{display:flex;flex-direction:column;gap:5px;padding:7px 9px;border-radius:9px;background:var(--chip)}
.slot .lbl{font-size:.78rem;color:var(--muted)}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:24px;height:24px;border-radius:50%;border:2px solid var(--pip);background:var(--pip);padding:0}
.pip.off{background:transparent;border-color:var(--pip-off)}
.pip.extra{border-style:dashed}
.concbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--conc-soft);border:1px solid var(--conc)}
.concbar b{color:var(--conc)}
.lvlh{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:6px 2px 0}
.spell{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.spell.bonus{border-left:4px solid var(--conc)}
.sh{display:flex;align-items:center;gap:10px;padding:10px 12px}
.sh .open{flex:1;min-width:0;display:flex;flex-direction:column;text-align:left;background:none;border:0;padding:0}
.sh .open b{font-weight:650}
.sh .open span{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font:500 .68rem var(--mono);padding:2px 6px;border-radius:6px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.k{background:var(--conc-soft);color:var(--conc)}
.tag.a{background:var(--accent);color:var(--accent-ink)}
.sb{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:.86rem}
.facts span{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.text{white-space:pre-line;max-width:65ch;margin:0}
.higher{white-space:pre-line;margin:0;padding:8px 10px;border-radius:8px;background:var(--chip);font-size:.92rem}
.cast{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pick{width:36px;height:36px;flex:0 0 auto;border-radius:9px;border:2px solid var(--line);background:transparent;font-weight:700;font-size:1.1rem;padding:0}
.pick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick.on.b{background:var(--conc);border-color:var(--conc)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.f{flex:0 0 auto;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.85rem}
.f[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.lock{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:420px;margin:0 auto}
.err{color:var(--danger);font-size:.9rem;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.9rem;max-width:calc(100% - 32px);z-index:20}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
label.fld input,label.fld select{color:var(--ink);font-size:1rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
